version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck       # Unhandled errors (critical for Fiber c.Next(), DB ops)
    - govet          # Misuse patterns the compiler misses
    - staticcheck    # Broader static analysis (SA*, S*, QF*, and simplification checks)
    - ineffassign    # Assignments whose values are never used
    - unused         # Unexported identifiers that are never used
    - gosec          # Security: SQL injection, weak crypto, SSRF patterns
    - bodyclose      # Unclosed HTTP response bodies (scraper safety)
    - noctx          # HTTP requests without context (timeout enforcement)
    - misspell       # Common typos in comments and strings

  settings:
    errcheck:
      # These return errors that are intentionally ignored in Fiber middleware chains
      exclude-functions:
        - (github.com/gofiber/fiber/v2.Ctx).Next
        - (github.com/gofiber/fiber/v2.Ctx).SendStatus

    gosec:
      excludes:
        - G115  # integer overflow (false positives on safe conversions)
        - G117  # "Secret" field name pattern (intentional in webhook response and reconciler structs)
        - G704  # SSRF via taint analysis (scrapers use a curated safe transport; webhook URLs validated at registration)
        - G706  # Log injection (body excerpts are diagnostic output from trusted external APIs)

  exclusions:
    rules:
      # Test files: relax errcheck, gosec, noctx, bodyclose — test scaffolding patterns
      - path: '.*_test\.go'
        linters:
          - gosec
          - errcheck
          - noctx
          - bodyclose
      # defer X.Close() — errors from deferred Close cannot be acted upon; idiomatic Go teardown
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck

issues:
  max-same-issues: 3
