[variables]
# Prevent Go from downloading a newer toolchain mid-build.
# GOTOOLCHAIN=local forces use of the installed Go binary; combined with
# go_1_24_2 in nixPkgs this keeps builds fast and deterministic.
GOTOOLCHAIN = "local"

[phases.setup]
nixPkgs = ["go_1_24_2"]

[phases.build]
cmds = [
  "GOBIN=$(pwd)/bin go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1",
  "go build -o bin/api ./cmd/api",
  "go build -o bin/worker ./cmd/worker"
]
