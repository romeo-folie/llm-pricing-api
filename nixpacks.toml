[variables]
# Force use of installed Go binary; prevents mid-build toolchain auto-download.
GOTOOLCHAIN = "local"

[phases.setup]
# nixpkgs-unstable at f8573b9c has go_1_24 (verified).
# The default pinned nixpkgs hash (e89cf1c9) only has go_1_21/go_1_22.
nixPkgs = ["go_1_24"]
nixpkgsArchive = "f8573b9c935cfaa162dd62cc9e75ae2db86f85df"

[phases.build]
cmds = [
  "GOBIN=$(pwd)/bin go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1",
  "go build -o bin/api ./cmd/api",
  "go build -o bin/worker ./cmd/worker"
]
