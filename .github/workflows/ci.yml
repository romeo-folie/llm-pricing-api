name: CI

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main]

# Least-privilege: jobs only need to read repository contents.
# Individual jobs can declare additional permissions if needed.
permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  # ─── Job 1: Build + unit tests (no external services needed) ─────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build API binary
        run: go build -o bin/api ./cmd/api

      - name: Build worker binary
        run: go build -o bin/worker ./cmd/worker

      - name: Run unit tests
        run: go test -race -count=1 ./...

  # ─── Job 2: Integration tests (PostgreSQL + Redis service containers) ─────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-and-test]

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: llmpricing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/llmpricing_test?sslmode=disable
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34  # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install migrate CLI
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Run migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run integration tests
        run: go test -race -count=1 -p 1 -tags integration -run Integration -v -timeout 120s ./...
