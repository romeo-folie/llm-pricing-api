groups:
  - name: llm-pricing-api-alerts
    interval: 1m
    rules:
      - alert: LLMAPIErrorRateSpike
        expr: |
          (sum(rate(llm_api_requests_total{status=~"5.."}[5m])) / sum(rate(llm_api_requests_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate > 5% for 5 minutes"

      - alert: LLMAPIAbuseSingleKeyHighVolume
        expr: |
          max(sum(increase(llm_api_rate_limit_hits_total[1h])) by (tier)) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejections exceeded threshold for a tier"

      - alert: LLMScraperFailureConsecutive
        expr: |
          sum(increase(llm_scraper_runs_total{status="error"}[30m])) by (source) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scraper failed 3+ times in 30m"

      - alert: LLMAPIP95LatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(llm_api_request_duration_seconds_bucket[10m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency > 2s for 10m"

      - alert: LLMPostgresConnectionPressure
        expr: |
          sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres active connections above threshold"

      - alert: LLMRedisMemoryPressure
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 80%"
