groups:
  - name: llm-pricing-api-alerts
    interval: 1m
    rules:
      # Convention: an alert that fires on the *presence* of a bad event must
      # still evaluate when that event has never happened. A label-filtered
      # counter (status=~"5..", status="error", result="unknown", …) has no
      # series until the event occurs, so the bare expression returns no data
      # and Grafana raises DatasourceNoData — which notifies. That paged for
      # hours while the API was perfectly healthy (#213).
      #
      # Guard such expressions with `or vector(0)` and set `no_data_state: OK`
      # so "nothing bad has happened" reads as 0 / OK. Rules that watch a
      # continuously-present gauge (freshness, stale ratio, connection count)
      # need neither: for those, absence of data really is the problem.
      #
      # Every expression must still end in a single comparison — the
      # provisioning parser extracts the Grafana threshold from it.

      # ── Liveness / uptime (#194) ──────────────────────────────────────────
      # #183 wedged the API for four days while Railway kept reporting the
      # deployment SUCCESS: its healthcheck is a one-time deploy gate, and the
      # process never exited. The watchdog restarts on dependency failure, but
      # nothing watched the services from outside.
      #
      # LLMScrapeTargetDown is the worker's only liveness signal — it has no
      # public domain, so it is scraped over Railway private networking and
      # `up` going to 0 is how a stopped or unreachable worker surfaces. For the
      # API the same expression catches a dead metrics listener; a wedge that
      # still answers /health but serves no traffic is caught by
      # LLMAPITrafficAbsent (the external synthetic probe on /health is the
      # third, fastest layer).
      - alert: LLMScrapeTargetDown
        expr: |
          up{job=~"llm-pricing-api|llm-pricing-worker"} < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A metrics scrape target has been unreachable for 5m"

      # Tuned against a day of traffic: the 15m request rate bottomed at
      # 0.043 req/s (avg 0.10), so 0.01 leaves a 4x margin before a genuinely
      # quiet period could page. Stays silent when the metric disappears
      # entirely — LLMScrapeTargetDown owns that case, and a second page for it
      # would be noise.
      - alert: LLMAPITrafficAbsent
        expr: |
          sum(rate(llm_api_requests_total[15m])) < 0.01
        for: 10m
        no_data_state: OK
        labels:
          severity: critical
        annotations:
          summary: "API completed almost no requests for 15 minutes"

      - alert: LLMAPIErrorRateSpike
        expr: |
          (sum(rate(llm_api_requests_total{status=~"5.."}[5m])) or vector(0)) / (sum(rate(llm_api_requests_total[5m])) or vector(0)) > 0.05
        for: 5m
        no_data_state: OK
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate > 5% for 5 minutes"

      - alert: LLMAPIAbuseSingleKeyHighVolume
        expr: |
          (max(sum(increase(llm_api_rate_limit_hits_total[1h])) by (tier)) or vector(0)) > 2000
        for: 5m
        no_data_state: OK
        labels:
          severity: warning
        annotations:
          summary: "Rate-limit rejections exceeded threshold for a tier"

      - alert: LLMScraperFailureConsecutive
        expr: |
          (sum(increase(llm_scraper_runs_total{status="error"}[30m])) by (source) or vector(0)) >= 3
        for: 1m
        no_data_state: OK
        labels:
          severity: critical
        annotations:
          summary: "Scraper failed 3+ times in 30m"

      - alert: LLMAPIP95LatencyHigh
        expr: |
          (histogram_quantile(0.95, sum(rate(llm_api_request_duration_seconds_bucket[10m])) by (le)) or vector(0)) > 2
        for: 10m
        no_data_state: OK
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency > 2s for 10m"

      - alert: LLMPostgresConnectionPressure
        expr: |
          sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres active connections above threshold"

      # redis_memory_max_bytes is 0 when Redis runs without a maxmemory policy,
      # which is how the managed instance is configured. The bare ratio was
      # therefore +Inf and the alert fired permanently the moment the
      # redis-exporter was deployed (#211). Multiplying by `(max > 0)` leaves
      # the expression with no series while the limit is unset, so the rule also
      # opts into `no_data_state: OK`: with no limit there is nothing to measure
      # against, and a silent exporter is #194's problem, not this rule's.
      # Kept as a single trailing comparison because the provisioning parser
      # extracts the Grafana threshold from it.
      - alert: LLMRedisMemoryPressure
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) * (redis_memory_max_bytes > 0) > 0.8
        for: 5m
        no_data_state: OK
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 80% of maxmemory"

      - alert: LLMSourceFreshnessStale
        expr: |
          time() - llm_source_last_success_timestamp_seconds > 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "A source has not had a successful verification in over 24h"

      # The ratio's denominator is each source's *active* prices — those verified
      # inside worker.DefaultActiveWindow (7 days) — so models upstream has
      # delisted or renamed drop out instead of inflating the ratio forever
      # (#217). A source that stops scraping still trips this while its models
      # age through the window, and LLMSourceFreshnessStale catches it
      # immediately.
      - alert: LLMPricesStaleRatioHigh
        expr: |
          max(llm_prices_stale_ratio) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 25% of a source's active prices are stale"

      # ── Benchmark evidence & capability scoring ───────────────────────────
      # llm_benchmark_scrape_runs_total is separate from llm_scraper_runs_total:
      # benchmark scrapes do not funnel through the price pipeline, so a failing
      # leaderboard scrape would otherwise be invisible. 3 errors in 30m is the
      # retry burst of one run, the same shape as LLMScraperFailureConsecutive.
      - alert: LLMBenchmarkScrapeFailureConsecutive
        expr: |
          (sum(increase(llm_benchmark_scrape_runs_total{status="error"}[30m])) by (source) or vector(0)) >= 3
        for: 1m
        no_data_state: OK
        labels:
          severity: critical
        annotations:
          summary: "A benchmark scraper failed 3+ times in 30m"

      # Answers the benchmark-audit question directly: are upstream leaderboards
      # publishing few mappable models, or is the slug allowlist rejecting most
      # entries? Fires when more than half of the leaderboard entries that
      # reached slug resolution in the last hour could not be mapped to a
      # canonical model. clamp_min(..., 1) keeps a near-empty denominator from
      # producing a spurious ratio.
      - alert: LLMSlugResolutionUnknownRateHigh
        expr: |
          (sum(rate(llm_slug_resolutions_total{result="unknown"}[1h])) or vector(0)) / clamp_min((sum(rate(llm_slug_resolutions_total[1h])) or vector(0)), 1) > 0.5
        for: 15m
        no_data_state: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 50% of leaderboard model names could not be mapped to a canonical slug"

      # Measured from evaluated_at, never last_observed_at: SWE-bench is
      # re-scraped daily, so observation time is always fresh while its newest
      # published evaluation is months old. This alert is expected to fire on
      # day one — the evidence genuinely is stale — and continuing to fire is
      # the honest signal that upstream has published nothing newer.
      - alert: LLMBenchmarkEvidenceStaleRatioHigh
        expr: |
          max(llm_benchmark_evidence_stale_ratio) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "More than 50% of a benchmark's active evidence is older than 90 days"

      # The scrape task still fails and retries; this makes the retry loop
      # visible instead of only appearing as a task-level error.
      - alert: LLMCapabilityRecomputeFailure
        expr: |
          (increase(llm_capability_recompute_failures_total[1h]) or vector(0)) > 0
        for: 5m
        no_data_state: OK
        labels:
          severity: critical
        annotations:
          summary: "Capability score recomputation failed in the last hour"
