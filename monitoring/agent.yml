server:
  log_level: info

prometheus:
  wal_directory: /tmp/grafana-agent-wal
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

  configs:
    - name: llm-pricing
      scrape_configs:
        - job_name: llm-pricing-api
          static_configs:
            # API metrics are exposed on the internal metrics server
            # (METRICS_PORT, default 9091) started by cmd/api/main.go.
            - targets: ["host.docker.internal:9091"]

        # The worker is a separate process with its own registry. Pipeline
        # counters (llm_scraper_runs_total, llm_reconciler_events_total,
        # llm_webhook_deliveries_total) exist only on this target — scraping
        # the API alone leaves the data-pipeline dashboard empty. Locally the
        # Makefile offsets the worker's METRICS_PORT to 9092 so both services
        # can run at once. This collector config is superseded by the OTel
        # Collector work in #195.
        - job_name: llm-pricing-worker
          static_configs:
            - targets: ["host.docker.internal:9092"]

        - job_name: postgres-exporter
          static_configs:
            - targets: ["postgres-exporter:9187"]

        - job_name: redis-exporter
          static_configs:
            - targets: ["redis-exporter:9121"]

      remote_write:
        - url: ${GRAFANA_CLOUD_URL}
          basic_auth:
            username: ${GRAFANA_CLOUD_USER}
            password: ${GRAFANA_CLOUD_API_KEY}
