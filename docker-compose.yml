services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: llmpricing
      POSTGRES_PASSWORD: llmpricing
      POSTGRES_DB: llmpricing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmpricing -d llmpricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://llmpricing:llmpricing@postgres:5432/llmpricing?sslmode=disable
    ports:
      - "9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  grafana-agent:
    image: grafana/agent:v0.43.4
    restart: unless-stopped
    depends_on:
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    environment:
      GRAFANA_CLOUD_URL: ${GRAFANA_CLOUD_URL}
      GRAFANA_CLOUD_USER: ${GRAFANA_CLOUD_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - ./monitoring/agent.yml:/etc/agent/agent.yml:ro
    command: ["--config.file=/etc/agent/agent.yml"]

volumes:
  postgres_data:
  redis_data:
