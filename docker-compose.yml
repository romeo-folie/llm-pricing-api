services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: llmpricing
      POSTGRES_PASSWORD: llmpricing
      POSTGRES_DB: llmpricing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmpricing -d llmpricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://llmpricing:llmpricing@postgres:5432/llmpricing?sslmode=disable
    ports:
      - "9187:9187"

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  # Single egress for all telemetry. Replaces the deprecated grafana-agent.
  # In production this runs as its own Railway service in the same project, so
  # that the *.railway.internal scrape targets resolve.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    depends_on:
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    # The API and worker run on the host (make run / make worker), not in
    # compose. On Linux this mapping is required to resolve
    # host.docker.internal; Docker Desktop on macOS provides it already, and
    # the mapping is harmless there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Scrape targets. The worker's metrics port is offset to 9092 by the
      # Makefile so it can run alongside the API.
      API_METRICS_TARGET: host.docker.internal:9091
      WORKER_METRICS_TARGET: host.docker.internal:9092
      POSTGRES_EXPORTER_TARGET: postgres-exporter:9187
      REDIS_EXPORTER_TARGET: redis-exporter:9121
      # Telemetry egress to Grafana Cloud. Values come from .env.
      GRAFANA_CLOUD_URL: ${GRAFANA_CLOUD_URL}
      GRAFANA_CLOUD_USER: ${GRAFANA_CLOUD_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_BASIC_AUTH_HEADER: ${GRAFANA_CLOUD_BASIC_AUTH_HEADER}
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # OTLP ingest from the API (gRPC + HTTP).
      - "4317:4317"
      - "4318:4318"
      # health_check extension.
      - "13133:13133"

volumes:
  postgres_data:
  redis_data:
