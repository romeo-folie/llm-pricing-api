services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: llmpricing
      POSTGRES_PASSWORD: llmpricing
      POSTGRES_DB: llmpricing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmpricing -d llmpricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
